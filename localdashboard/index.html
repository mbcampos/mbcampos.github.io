<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@200;400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <div class="bg-layer" aria-hidden="true">
    <div class="bg-image" id="bg-image"></div>
    <div class="bg-overlay"></div>
  </div>

  <main class="startpage">
    <div class="corner-btns">
      <div class="corner-group">
        <button class="bg-btn" id="settings-btn" type="button" title="Configurações">
          <span class="material-symbols-outlined">settings</span>
        </button>
        <div class="settings-menu" id="settings-menu" hidden>
          <button class="settings-item" id="export-btn" type="button">
            <span class="material-symbols-outlined">download</span>
            <span>Exportar configurações</span>
          </button>
          <button class="settings-item" id="import-btn" type="button">
            <span class="material-symbols-outlined">upload</span>
            <span>Importar configurações</span>
          </button>
        </div>
      </div>
      <button class="bg-btn" id="feed-btn" type="button" title="Feed de notícias">
        <span class="material-symbols-outlined">rss_feed</span>
      </button>
      <button class="bg-btn" id="bg-btn" type="button" title="Plano de fundo">
        <span class="material-symbols-outlined">image</span>
      </button>
    </div>

    <input type="file" id="import-file" accept=".json,application/json" hidden>

    <div class="cast">

      <section class="hero">
        <div class="clock-cluster">
          <span class="clock" id="clock-h">--</span>
          <span class="clock-colon">:</span>
          <span class="clock" id="clock-m">--</span>
        </div>
        <div class="date-row mono" id="date">--</div>
      </section>

      <section class="search-zone">
        <div class="search-row">
          <form id="search-form" class="search-box">
            <span class="material-symbols-outlined search-icon">search</span>
            <input id="search-input" type="text" placeholder="Pesquisar na web ou digitar URL..." autocomplete="off">
            <kbd class="hotkey mono">/</kbd>
          </form>
          <button class="add-fav-btn" id="add-fav-btn" type="button" title="Adicionar favorito">
            <span class="material-symbols-outlined">add</span>
          </button>
        </div>
      </section>

      <section class="news-grid" id="news-grid">
        <div class="news-zone" id="news-zone" hidden>
          <div class="news-head">
            <span class="news-title" id="news-title">Notícias</span>
            <button class="icon-btn news-refresh" id="news-refresh" type="button" title="Atualizar">
              <span class="material-symbols-outlined">refresh</span>
            </button>
          </div>
          <div class="news-list" id="news-list"></div>
        </div>

        <div class="news-zone" id="news-zone-2" hidden>
          <div class="news-head">
            <span class="news-title" id="news-title-2">Notícias</span>
            <button class="icon-btn news-refresh" id="news-refresh-2" type="button" title="Atualizar">
              <span class="material-symbols-outlined">refresh</span>
            </button>
          </div>
          <div class="news-list" id="news-list-2"></div>
        </div>

        <div class="resize-handle news-resize" id="news-resize-handle" title="Arrastar para redimensionar"></div>
      </section>

      <div class="fav-area">
        <div class="fav-shelf">
          <nav class="tabs" id="tabs" aria-label="Categorias"></nav>

          <div class="dock-panels" id="panels"></div>

          <div class="resize-handle" id="resize-handle" title="Arrastar para redimensionar"></div>
        </div>

        <div class="manage-link" id="manage-link" role="button" tabindex="0" title="Gerenciar categorias">
          <span class="material-symbols-outlined">tune</span>
          <span>Gerenciar categorias</span>
        </div>
      </div>

    </div>
  </main>

  <!-- MODAL FAVORITO -->
  <div class="overlay" id="bookmark-modal" hidden>
    <div class="modal">
      <div class="modal-header">
        <h3 class="modal-title" id="modal-title">Novo Favorito</h3>
        <button class="icon-btn" id="modal-close" type="button">
          <span class="material-symbols-outlined">close</span>
        </button>
      </div>

      <form class="modal-form" id="favorite-form">
        <div class="field">
          <label for="f-name">Nome</label>
          <input id="f-name" type="text" placeholder="Ex: GitHub" required>
        </div>

        <div class="field">
          <label for="f-url">URL</label>
          <div class="url-row">
            <input id="f-url" type="url" placeholder="https://..." required>
            <div class="icon-well" id="favicon-preview">
              <span class="material-symbols-outlined">public</span>
            </div>
          </div>
        </div>

        <div class="field">
          <label for="f-category">Categoria</label>
          <select id="f-category"></select>
        </div>

        <div class="field">
          <label for="f-icon">Ícone personalizado (URL, opcional)</label>
          <input id="f-icon" type="url" placeholder="https://exemplo.com/icone.png">
        </div>

        <div class="field">
          <label for="f-service">Serviço de favicon personalizado (opcional)</label>
          <input id="f-service" type="url" placeholder="https://servico.com/icon?domain={domain}">
          <span class="field-hint mono">Use {domain} e {url}</span>
        </div>

        <div class="modal-actions">
          <button class="btn-danger" id="f-delete" type="button" hidden>
            <span class="material-symbols-outlined">delete</span>
            <span>Excluir</span>
          </button>
          <div class="flex-spacer"></div>
          <button class="btn-ghost" id="f-cancel" type="button">Cancelar</button>
          <button class="btn-primary" type="submit">Salvar</button>
        </div>
      </form>
    </div>
  </div>

  <!-- MODAL PLANO DE FUNDO -->
  <div class="overlay" id="bg-modal" hidden>
    <div class="modal">
      <div class="modal-header">
        <h3 class="modal-title">Plano de fundo</h3>
        <button class="icon-btn" id="bg-close" type="button">
          <span class="material-symbols-outlined">close</span>
        </button>
      </div>

      <form class="modal-form" id="bg-form">
        <div class="field">
          <label for="bg-url">Imagem (URL)</label>
          <input id="bg-url" type="url" placeholder="https://exemplo.com/imagem.jpg">
        </div>

        <div class="field">
          <label>Escolher da galeria</label>
          <div class="preset-grid" id="bg-presets"></div>
        </div>

        <div class="modal-actions">
          <button class="btn-ghost" id="bg-clear" type="button">Remover</button>
          <div class="flex-spacer"></div>
          <button class="btn-ghost" id="bg-cancel" type="button">Cancelar</button>
          <button class="btn-primary" type="submit">Aplicar</button>
        </div>
      </form>
    </div>
  </div>

  <!-- MODAL FEED DE NOTÍCIAS -->
  <div class="overlay" id="feed-modal" hidden>
    <div class="modal">
      <div class="modal-header">
        <h3 class="modal-title">Feed de notícias</h3>
        <button class="icon-btn" id="feed-close" type="button">
          <span class="material-symbols-outlined">close</span>
        </button>
      </div>

      <form class="modal-form" id="feed-form">
        <div class="feed-block">
          <div class="field">
            <label for="feed-title">Título</label>
            <input id="feed-title" type="text" maxlength="30" placeholder="Notícias">
          </div>

          <div class="feed-row">
            <div class="field">
              <label for="feed-url">Feed 1 · URL do RSS</label>
              <input id="feed-url" type="url" placeholder="https://exemplo.com/feed.xml">
              <span class="field-hint mono">Ex.: https://g1.globo.com/rss/g1/</span>
            </div>

            <div class="field feed-count-field">
              <label for="feed-count">Notícias</label>
              <select id="feed-count">
                <option value="3">3</option>
                <option value="5" selected>5</option>
                <option value="8">8</option>
              </select>
            </div>
          </div>
        </div>

        <div class="feed-block">
          <div class="field">
            <label for="feed-title-2">Título</label>
            <input id="feed-title-2" type="text" maxlength="30" placeholder="Notícias">
          </div>

          <div class="feed-row">
            <div class="field">
              <label for="feed-url-2">Feed 2 · URL do RSS</label>
              <input id="feed-url-2" type="url" placeholder="https://exemplo.com/feed2.xml">
              <span class="field-hint mono">Deixe vazio para mostrar apenas o Feed 1</span>
            </div>

            <div class="field feed-count-field">
              <label for="feed-count-2">Notícias</label>
              <select id="feed-count-2">
                <option value="3">3</option>
                <option value="5" selected>5</option>
                <option value="8">8</option>
              </select>
            </div>
          </div>
        </div>

        <div class="modal-actions">
          <button class="btn-ghost" id="feed-clear" type="button">Remover feeds</button>
          <div class="flex-spacer"></div>
          <button class="btn-ghost" id="feed-cancel" type="button">Cancelar</button>
          <button class="btn-primary" type="submit">Aplicar</button>
        </div>
      </form>
    </div>
  </div>

  <!-- MODAL CATEGORIAS -->
  <div class="overlay" id="manage-modal" hidden>
    <div class="modal">
      <div class="modal-header">
        <h3 class="modal-title">Gerenciar categorias</h3>
        <button class="icon-btn" id="manage-close" type="button">
          <span class="material-symbols-outlined">close</span>
        </button>
      </div>

      <div class="cat-list" id="cat-list"></div>

      <div class="modal-actions">
        <div class="flex-spacer"></div>
        <button class="btn-primary" id="manage-done" type="button">Concluir</button>
      </div>
    </div>
  </div>

  <!-- MODAL NOVA CATEGORIA -->
  <div class="overlay" id="cat-modal" hidden>
    <div class="modal">
      <div class="modal-header">
        <h3 class="modal-title">Nova categoria</h3>
        <button class="icon-btn" id="cat-close" type="button">
          <span class="material-symbols-outlined">close</span>
        </button>
      </div>

      <form class="modal-form" id="cat-form">
        <div class="field">
          <label for="cat-name">Nome</label>
          <input id="cat-name" type="text" placeholder="Ex: Finanças" maxlength="24" required>
        </div>

        <div class="modal-actions">
          <div class="flex-spacer"></div>
          <button class="btn-ghost" id="cat-cancel" type="button">Cancelar</button>
          <button class="btn-primary" type="submit">Criar</button>
        </div>
      </form>
    </div>
  </div>

  <!-- MODAL CONFIRMAÇÃO -->
  <div class="overlay" id="confirm-modal" hidden>
    <div class="modal">
      <div class="modal-header">
        <h3 class="modal-title" id="confirm-title">Excluir</h3>
        <button class="icon-btn" id="confirm-close" type="button">
          <span class="material-symbols-outlined">close</span>
        </button>
      </div>

      <p class="confirm-msg" id="confirm-msg"></p>

      <div class="modal-actions">
        <div class="flex-spacer"></div>
        <button class="btn-ghost" id="confirm-cancel" type="button">Cancelar</button>
        <button class="btn-danger" id="confirm-ok" type="button">
          <span class="material-symbols-outlined">delete</span>
          <span id="confirm-ok-label">Excluir</span>
        </button>
      </div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
