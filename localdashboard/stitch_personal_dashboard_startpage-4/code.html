<script class="">
  function switchTab(tabId) {
    const panels = document.querySelectorAll('.group-panel');
    panels.forEach(p => {
      p.classList.add('hidden');
      p.classList.remove('flex');
    });
    const target = document.getElementById('group-panel-' + tabId);
    if (target) {
      target.classList.remove('hidden');
      target.classList.add('flex');
    }

    const triggers = document.querySelectorAll('.tab-trigger');
    triggers.forEach(t => {
      t.classList.remove('bg-white/20', 'text-white', 'shadow-sm', 'border', 'border-white/15');
      t.classList.add('text-white/60');
    });
    const activeBtn = document.getElementById('tab-btn-' + tabId);
    if (activeBtn) {
      activeBtn.classList.remove('text-white/60');
      activeBtn.classList.add('bg-white/20', 'text-white', 'shadow-sm', 'border', 'border-white/15');
    }
  }

  function promptNewGroup() {
    const name = prompt('Nome da nova categoria / grupo:');
    if (name) alert('Categoria "' + name + '" criada com sucesso!');
  }
</script></main>
