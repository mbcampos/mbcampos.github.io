<script>
  // 1. Live Digital Clock & Greeting Update in pt-BR
  function updateLiveClock() {
    const now = new Date();
    const hours = String(now.getHours()).padStart(2, '0');
    const minutes = String(now.getMinutes()).padStart(2, '0');
    const seconds = String(now.getSeconds()).padStart(2, '0');

    const hElem = document.getElementById('live-hours');
    const mElem = document.getElementById('live-minutes');
    const sElem = document.getElementById('live-seconds');
    if (hElem) hElem.textContent = hours;
    if (mElem) mElem.textContent = minutes;
    if (sElem) sElem.textContent = seconds;

    // Greeting logic
    const hourNum = now.getHours();
    let greeting = 'Boa noite, Alex';
    if (hourNum >= 5 && hourNum < 12) {
      greeting = 'Bom dia, Alex';
    } else if (hourNum >= 12 && hourNum < 18) {
      greeting = 'Boa tarde, Alex';
    }
    const gElem = document.getElementById('live-greeting');
    if (gElem) gElem.textContent = greeting;

    // Localized Date in Portuguese
    const options = { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' };
    const dateStr = now.toLocaleDateString('pt-BR', options);
    const dElem = document.getElementById('live-date');
    if (dElem && dateStr) {
      dElem.textContent = dateStr.charAt(0).toUpperCase() + dateStr.slice(1);
    }
  }
  setInterval(updateLiveClock, 1000);
  updateLiveClock();

  // 2. Search Engine Switcher Logic
  let currentEngineBase = 'https://www.google.com/search?q=';
  const engineBtn = document.getElementById('engine-btn');
  const engineMenu = document.getElementById('engine-menu');

  if (engineBtn && engineMenu) {
    engineBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      engineMenu.classList.toggle('hidden');
    });
    document.addEventListener('click', () => {
      engineMenu.classList.add('hidden');
    });
  }

  function selectEngine(name, iconChar, baseUrl) {
    currentEngineBase = baseUrl;
    const label = document.getElementById('engine-label');
    const icon = document.getElementById('engine-icon');
    if (label) label.textContent = name;
    if (icon) icon.textContent = iconChar;
    if (engineMenu) engineMenu.classList.add('hidden');
  }

  function executeSearch(e) {
    e.preventDefault();
    const queryInput = document.getElementById('search-input');
    if (!queryInput) return;
    const query = queryInput.value.trim();
    if (!query) return;

    if (query.startsWith('http://') || query.startsWith('https://')) {
      window.open(query, '_blank');
    } else if (query.includes('.') && !query.includes(' ')) {
      window.open('https://' + query, '_blank');
    } else {
      window.open(currentEngineBase + encodeURIComponent(query), '_blank');
    }
  }

  function clearSearch() {
    const input = document.getElementById('search-input');
    if (input) {
      input.value = '';
      input.focus();
    }
  }

  // Hotkey '/' to focus search omnibox
  document.addEventListener('keydown', (e) => {
    if (e.key === '/' && document.activeElement.tagName !== 'INPUT' && document.activeElement.tagName !== 'TEXTAREA') {
      e.preventDefault();
      const sInput = document.getElementById('search-input');
      if (sInput) sInput.focus();
    }
  });

  // 3. Card Context Dropdown
  function toggleCardMenu(e, menuId) {
    e.stopPropagation();
    const menu = document.getElementById(menuId);
    if (menu) {
      menu.classList.toggle('hidden');
    }
  }
  document.addEventListener('click', () => {
    const calcMenu = document.getElementById('menu-calc');
    if (calcMenu) calcMenu.classList.add('hidden');
  });

  // 4. Modal Interactions (Add / Edit Favorite)
  const modal = document.getElementById('bookmark-modal');

  function openModal(mode, name = '', url = '', cat = 'Finanças') {
    if (!modal) return;
    modal.classList.remove('hidden');
    modal.classList.add('flex');

    const titleElem = document.getElementById('modal-title');
    const nameElem = document.getElementById('bookmark-name');
    const urlElem = document.getElementById('bookmark-url');
    const catElem = document.getElementById('bookmark-category');
    const delBtn = document.getElementById('modal-delete-btn');

    if (mode === 'add') {
      if (titleElem) titleElem.textContent = 'Adicionar Favorito';
      if (nameElem) nameElem.value = '';
      if (urlElem) urlElem.value = 'https://';
      if (catElem) catElem.value = 'Geral';
      if (delBtn) delBtn.classList.add('hidden');
    } else {
      if (titleElem) titleElem.textContent = 'Editar Favorito';
      if (nameElem) nameElem.value = name || 'CalculaBolsa';
      if (urlElem) urlElem.value = url || 'https://calculabolsa.com';
      if (catElem) catElem.value = cat || 'Finanças';
      if (delBtn) delBtn.classList.remove('hidden');
    }
  }

  function closeModal() {
    if (!modal) return;
    modal.classList.add('hidden');
    modal.classList.remove('flex');
  }

  function updateFaviconPreview(url) {
    const preview = document.getElementById('favicon-preview');
    if (!preview) return;
    try {
      const parsed = new URL(url);
      preview.innerHTML = `<span class="material-symbols-outlined text-[20px]">public</span>`;
    } catch {
      // Keep existing
    }
  }

  function saveBookmark(e) {
    e.preventDefault();
    closeModal();
  }

  function deleteBookmark() {
    closeModal();
  }
</script></main>
